openapi: 3.0.0
info:
  version: v1.0
  title: Consent Management API
  description: |
    This API provides a comprehensive set of endpoints for managing consents and consent elements.

    **Key Concepts:**

    - **Consent Elements**: A single, reference data element for which user consent is requested.
      Each consent element has a unique name and can be configured with name, description, properties, and a type.
      Examples: email, mobile

    - **Consent Purpose**: A logical grouping of related consent elements that represents a specific reason for requesting consent.
      Consent purposes help organize multiple consent elements to enable clear and streamlined consent collection.
      A consent can be associated with one or more, consent purposes.

    - **Consent**: A Consent represents the explicit approval given by a user for each one or more consent purposes.
      Each consent purpose contains a set of consent elements that specify exactly what data the user is agreeing to share.
      A consent serves as the authoritative record of the approved consent purposes and their associated consent elements.
  contact:
    name: WSO2
    url: 'https://wso2.com/solutions/financial-services/'
    email: "architecture@wso2.com"
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://{km_host}:{km_port}/api/v1
    variables:
      km_host:
        default: localhost
        description: Hostname of the Consent Management server.
      km_port:
        default: "3000"
        description: Port number for the Consent Management server.
tags:
  - name: Consent Elements
    description: Manage element definitions (reference data for categorizing consents). Elements can be created, retrieved, updated, deleted, and validated.
  - name: Consent Purpose
    description: Manage consent purposes. Purposes allow organizing related elements together with mandatory/optional flags for streamlined consent collection.
  - name: Consent
    description: Provides RESTful endpoints to handle the full lifecycle of consent resources and their associated authorizations. Supports operations such as initiation, retrieval, update, and revocation.
paths:
  /consents:
    post:
      summary: Initiate a new consent resource
      description: |
        This endpoint is used to initiate a new consent resource.

        Upon success, the system creates a **consent resource** with: A unique `consentId`

        **Purpose Validation:**
        - Cannot create consent with purposes that contain duplicate consent elements. Each element
          can only appear once across all purposes in the request.

        **Response Behavior:**
        - The consent creation response payload includes all elements within each purpose.
        - If the request contains only a subset of elements for a purpose, any unmentioned elements from
          that purpose are automatically resolved and returned with `isUserApproved: false`.
      operationId: consents-POST
      tags:
        - Consent
      parameters:
        - in: header
          name: org-id
          required: true
          description: "The unique identifier for the organization (e.g., the bank) that this consent belongs to."
          schema:
            type: string
            example: "ORG-001"
        - in: header
          name: TPP-client-id
          required: true
          description: "The client ID of the Third-Party Provider (TPP) application that is requesting the consent."
          schema:
            type: string
            example: "TPP-CLIENT-001"
      requestBody:
        description: The payload containing the consent data.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentCreatePayload"
            example:
              type: "marketing"
              validityTime: 1766383796
              recurringIndicator: true
              dataAccessValidityDuration: 0
              frequency: 0
              purposes:
                - name: "marketing_communication_preferences"
                  version: "1"
                  elements:
                    - name: "user_email"
                      isUserApproved: true
                      value: {}
                    - name: "user_mobile"
                      isUserApproved: true
                      value: {}
              attributes:
                department: "marketing"
              authorizations:
                - userId: "user1@example.com"
                  type: "authorisation"
                  status: "APPROVED"
                  resources:
                    accountIds: ["acc-123", "acc-456"]
      responses:
        "201":
          description: Successfully initiated the consent. The response body contains the details of the newly created consent resource, including its `id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentCreatedResponse"
        "400":
          description: Bad Request. The request was malformed. This could be due to missing required headers or an invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
        "500":
          description: Internal Server Error. An unexpected error occurred on the server while trying to create the consent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
      security:
        - basicAuth: []
    get:
      summary: Search for consents
      description: |
        Provides a powerful search capability to find consents based on various filter criteria like consent type, status, client ID , user ID and time range. Supports pagination.

      operationId: consents-search-GET
      tags:
        - Consent
      parameters:
        - in: header
          name: org-id
          required: true
          description: "Organisation ID."
          schema:
            type: string
            example: "ORG-001"
        - name: consentTypes
          in: query
          description: A comma-separated list of consent types to filter by (e.g., 'accounts,payments').
          schema:
            type: string
          example: "accounts,payments"
        - name: consentStatuses
          in: query
          description: "A comma-separated list of consent statuses to filter by (e.g., 'ACTIVE,REVOKED'). Valid values are: CREATED, ACTIVE, REJECTED, REVOKED, EXPIRED."
          schema:
            type: string
          example: "ACTIVE,CREATED"
        - name: clientIds
          in: query
          description: A comma-separated list of TPP client IDs to filter by.
          schema:
            type: string
          example: "TPP-CLIENT-001,TPP-CLIENT-002"
        - name: userIds
          in: query
          description: A comma-separated list of end-user IDs to filter by.
          schema:
            type: string
          example: "user1@example.com,user2@example.com"
        - name: purposeNames
          in: query
          description: A comma-separated list of consent purpose names to filter by. Returns consents that contain ANY of the specified purposes.
          schema:
            type: string
          example: "marketing_communication_preferences,profile_access"
        - name: fromTime
          in: query
          description: The start of the time window for the search, as a Unix timestamp in seconds (integer).
          schema:
            type: integer
            format: int64
          example: 1702800000
        - name: toTime
          in: query
          description: The end of the time window for the search, as a Unix timestamp in seconds (integer).
          schema:
            type: integer
            format: int64
          example: 1734422400
        - name: limit
          in: query
          description: The maximum number of results to return in a single page. Used for pagination.
          schema:
            type: integer
            format: int32
          example: 10
        - name: offset
          in: query
          description: The number of results to skip. Used for pagination.
          schema:
            type: integer
            format: int32
          example: 0
      responses:
        "200":
          description: OK. Returns a list of consents matching the search criteria, along with pagination metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentSearchResponse"
        "400":
          description: Bad Request. The search parameters provided are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
        "500":
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
      security:
        - basicAuth: []
  /consents/attributes:
    get:
      summary: Search consents by attribute key and value
      description: |
        Searches for consent IDs that have a specific attribute key, optionally filtered by value.

        **Search Modes:**
        - **By key only** (`?key=department`): Returns all consents with the specified attribute key
        - **By key and value** (`?key=department&value=sales`): Returns consents with exact key-value match

        Results are organization-scoped and sorted by consent ID.
      operationId: consents-attributes-GET
      tags:
        - Consent
      parameters:
        - in: header
          name: org-id
          required: true
          description: "The unique identifier for the organization."
          schema:
            type: string
            example: "ORG-001"
        - name: key
          in: query
          required: true
          description: The attribute key to search for (required).
          schema:
            type: string
          example: "department"
        - name: value
          in: query
          required: false
          description: The attribute value to search for (optional). If provided, only consents with exact key-value match are returned.
          schema:
            type: string
          example: "sales"
      responses:
        "200":
          description: Successfully retrieved consent IDs matching the search criteria.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentAttributeSearchResponse"
        "400":
          description: Bad Request. The key parameter is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
        "500":
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
      security:
        - basicAuth: []
  /consents/{consentId}:
    get:
      summary: Retrieve a consent by its ID
      description: |
        Fetches the complete details of a specific consent resource using
        its unique `consentID`. This is used to check the status and details of a consent.

      operationId: consents-GET
      tags:
        - Consent
      parameters:
        - in: header
          name: org-id
          required: true
          description: "The unique identifier for the organization (e.g., the bank) that this consent belongs to."
          schema:
            type: string
            example: "ORG-001"
        - in: path
          name: consentId
          required: true
          description: The unique identifier of the consent to retrieve.
          schema:
            type: string
      responses:
        "200":
          description: OK. The full details of the requested consent are returned in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRetrievalResponse"
        "400":
          description: Bad Request. The request was invalid, possibly due to a malformed `consentID` or missing headers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
        "500":
          description: Internal Server Error. An unexpected error occurred on the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
      security:
        - basicAuth: []
    put:
      summary: Update a consent resource by its ID
      description: |
        Endpoint to perform a full update on a consent resource, including its authorization resources and attributes, in a single operation.

        **Purpose Validation:**
        - Cannot update consent with purposes that contain duplicate consent elements. Each purpose
          can only appear once across all purposes in the request.

        **Response Behavior:**
        - The consent update response payload includes all purposes within each purpose.
        - If the request contains only a subset of purposes for a purpose, any unmentioned purposes from
          that purpose are automatically resolved and returned with `isUserApproved: false`.

      operationId: consents-PUT
      tags:
        - Consent
      parameters:
        - in: header
          name: org-id
          required: true
          description: "Organisation ID."
          schema:
            type: string
            example: "ORG-001"
        - in: header
          name: TPP-client-id
          required: true
          description: "The client ID of the Third-Party Provider (TPP) application that is requesting the consent."
          schema:
            type: string
            example: "TPP-CLIENT-001"
        - name: consentId
          in: path
          description: The unique identifier of the consent to update.
          required: true
          schema:
            type: string
      requestBody:
        description: The full consent resource object with the desired updates.
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ConsentUpdateRequest"
            example:
              type: "accounts"
              validityTime: 0
              recurringIndicator: false
              dataAccessValidityDuration: 86400
              frequency: 0
              purposes:
                - name: "profile_access"
                  version: "1"
                  elements:
                    - name: "first_name"
                      isUserApproved: true
                      value: {}
                    - name: "last_name"
                      isUserApproved: true
                      value: {}
              attributes:
                department: "sales"
                region: "APAC"
              authorizations:
                - userId: "user1@example.com"
                  type: "authorisation"
                  status: "APPROVED"
                  resources:
                    accountIds: ["acc-123", "acc-456"]
        required: true
      responses:
        "200":
          description: OK. The full details of the requested consent are returned in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentUpdateResponse"
        "400":
          description: Bad Request. The request was malformed. This could be due to missing required headers or an invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
        "500":
          description: Internal Server Error. An unexpected error occurred on the server while trying to update the consent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
      security:
        - basicAuth: []
  /consents/{consentId}/revoke:
    put:
      summary: Revoke a consent
      description: |
       Allows to revoke a consent. This action typically updates the consent status to a **revoke** type of status.

      operationId: consents-revoke-POST
      tags:
        - Consent
      parameters:
        - in: header
          name: org-id
          required: true
          description: "The unique identifier for the organization (e.g., the bank) that this consent belongs to."
          schema:
            type: string
            example: "ORG-001"
        - name: consentId
          in: path
          description: The unique identifier of the consent to update.
          required: true
          schema:
            type: string
      requestBody:
        description: The payload containing the revocation data.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRevokePayload"
      responses:
        "200":
          description: Successfully revoked the consent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRevokedResponse"
        "400":
          description: Bad Request. The request was malformed. This could be due to missing required headers or an invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
        "500":
          description: Internal Server Error. An unexpected error occurred on the server while trying to create the consent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
      security:
        - basicAuth: []
  /consents/{consentId}/authorizations:
    post:
      summary: Add an authorization resource to a consent
      description: Creates a new authorization resource and links it to the specified consent. This is typically done when a user interacts with the consent (e.g., at the start of the authorization flow).
      operationId: consents-authorizations-POST
      tags:
        - Consent
      parameters:
        - in: header
          name: org-id
          required: true
          description: "Organisation ID."
          schema:
            type: string
            example: "ORG-001"
        - name: consentId
          in: path
          description: The unique identifier of the consent.
          required: true
          schema:
            type: string
      requestBody:
        description: Details of the authorization resource to be created.
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AuthorizationResourceRequestBody"
        required: true
      responses:
        '200':
          description: OK. Returns the details of the authorization resource.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ConsentAuthorizationResource"
        "400":
          description: Bad Request. The request was malformed. This could be due to missing required headers or an invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
        "500":
          description: Internal Server Error. An unexpected error occurred on the server while trying to create the consent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
      security:
        - basicAuth: []
    get:
      summary: Retrieve all authorization resources for a consent
      description: Retrieves a list of all authorization resources associated with a specific consent.
      operationId: consentAuthorizationGet
      tags:
        - Consent
      parameters:
        - in: header
          name: org-id
          required: true
          description: "Organisation ID."
          schema:
            type: string
            example: "ORG-001"
        - name: consentId
          in: path
          description: The unique identifier of the consent.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK. Returns an array of authorization resources.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConsentAuthorizationResource"
        "400":
          description: Bad Request. The request was malformed. This could be due to missing required headers or an invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
        "500":
          description: Internal Server Error. An unexpected error occurred on the server while trying to create the consent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
      security:
        - basicAuth: []
  /consents/{consentId}/authorizations/{authorizationId}:
    get:
      summary: Retrieve a specific authorization resource
      description: Retrieves the details of a specific authorization resource linked to a given consent.
      operationId: consentAuthorizationIdGet
      tags:
        - Consent
      parameters:
        - in: header
          name: org-id
          required: true
          description: "Organisation ID."
          schema:
            type: string
        - name: consentId
          in: path
          description: The unique identifier of the consent.
          required: true
          schema:
            type: string
        - name: authorizationId
          in: path
          description: The unique identifier of the authorization resource.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK. Returns the details of the authorization resource.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ConsentAuthorizationResource"
        "400":
          description: Bad Request. The request was malformed. This could be due to missing required headers or an invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
        "500":
          description: Internal Server Error. An unexpected error occurred on the server while trying to create the consent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
      security:
        - basicAuth: []
    put:
      summary: Update an authorization resource
      description: Updates the details (e.g., status) of a specific authorization resource associated with the given consent.
      operationId: consentAuthorizationIdPut
      tags:
        - Consent
      parameters:
        - in: header
          name: org-id
          required: true
          description: "Organisation ID."
          schema:
            type: string
            example: "ORG-001"
        - name: consentId
          in: path
          description: The unique identifier of the consent.
          required: true
          schema:
            type: string
        - name: authorizationId
          in: path
          description: The unique identifier of the authorization resource to update.
          required: true
          schema:
            type: string
      requestBody:
        description: The updated details for the authorization resource.
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AuthorizationResourceRequestBody"
        required: true
      responses:
        '200':
          description: OK. Returns the details of the authorization resource.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ConsentAuthorizationResource"
        "400":
          description: Bad Request. The request was malformed. This could be due to missing required headers or an invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
        "500":
          description: Internal Server Error. An unexpected error occurred on the server while trying to create the consent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
      security:
        - basicAuth: []
  /consents/validate:
    post:
      summary: Validate a consent for a specific action
      description: |
        Validates whether a consent is valid and active for a specific user action or API request.

        This endpoint checks:
        - If the consent exists and belongs to the specified user
        - If the consent status is active (AUTHORIZED, ACTIVE, etc.)
        - If the consent has not expired based on validityTime
        - If all mandatory elements within the purposes are approved (isUserApproved: true)
        - Optionally validates resource parameters against consent scope

        If the consent has expired, the endpoint automatically updates the consent status to EXPIRED.
        If mandatory elements are not approved, validation returns false.

        **Response includes enriched consent information:**
        - Complete consent details with all fields
        - Consent elements enriched with type, description, and properties from element definitions

        **Note:** All responses return HTTP 200. Check the `isValid` field and `httpCode` in the response body to determine the actual validation result.
      operationId: consents-validate-POST
      tags:
        - Consent
      parameters:
        - in: header
          name: org-id
          required: true
          description: "The unique identifier for the organization."
          schema:
            type: string
            example: "ORG-001"
      requestBody:
        description: The validation request containing consent details and the action being validated.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
            example:
              consentId: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        "200":
          description: |
            Validation completed. Check the `isValid` field in the response body.
            - If `isValid: true`, the consent is valid for the requested action
            - If `isValid: false`, check `errorCode`, `errorMessage`, and `httpCode` for details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
              example:
                isValid: true
                consentInformation:
                  id: "123e4567-e89b-12d3-a456-426614174000"
                  type: "accounts"
                  clientId: "tpp-client-123"
                  status: "ACTIVE"
                  createdTime: 1702800000
                  updatedTime: 1702800000
                  validityTime: 1734422400
                  recurringIndicator: true
                  frequency: 10
                  dataAccessValidityDuration: 86400
                  purposes:
                    - name: "marketing_communication_preferences"
                      version: "1.0"
                      elements:
                        - name: "first_name"
                          value: {}
                          isUserApproved: true
                          isMandatory: true
                          type: "basic"
                          displayName: "First Name"
                          version: "1.0"
                          description: "Allows access to the user's first name"
                          properties:
                            jsonPath: "$.personal.firstName"
                            resourcePath: "/user/{nic}"
                  attributes:
                    department: "sales"
                    region: "APAC"
                  authorizations:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      userId: "user1@example.com"
                      type: "authorisation"
                      status: "APPROVED"
                      updatedTime: 1702800000
                      resources:
                        accountIds: ["acc-123", "acc-456"]
        "400":
          description: Bad Request - Invalid request body or missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
              example:
                code: "BAD_REQUEST"
                message: "Invalid request"
                description: "Missing required field: consentId"
                traceId: "20260107T123456Z-abc123"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
              example:
                code: "INTERNAL_ERROR"
                message: "Server error"
                description: "An unexpected error occurred"
                traceId: "20260107T123456Z-abc123"
      security:
        - basicAuth: []
  /consent-elements:
    post:
      summary: Create one or more consent elements
      description: |
        Creates one or more consent elements in a single request. Supports batch creation by accepting
        an array of element definitions.

        **Validation Rules:**
        - Name is required and must not exceed 255 characters
        - Name must be unique within the organization (checked against existing elements and within the batch)
        - Type is required and must be one of: `basic`, `json`, `xml`
        - displayName is optional
        - version is optional
        - Description is optional but must not exceed 1024 characters if provided
        - At least one element must be provided in the request array
        - Duplicate names within the same batch are not allowed
      operationId: createConsentPurposes
      tags:
        - Consent Elements
      parameters:
        - in: header
          name: org-id
          required: true
          description: The unique identifier for the organization that owns these elements
          schema:
            type: string
            example: "ORG-001"
      requestBody:
        description: Array of consent elements to create
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/ConsentPurposeCreateRequest"
            examples:
              basicType:
                summary: Basic type with resourcePath and jsonPath
                value:
                  - type: "basic"
                    name: "first_name"
                    displayName: "To be used in UIs etc."
                    description: "Allows access to the user's first name"
                    properties:
                      resourcePath: "/Patient/{firstName}"
                      jsonPath: "$.patient.firstName"
              jsonType:
                summary: JSON type with validationSchema
                value:
                  - type: "json"
                    name: "account_schema"
                    displayName: "To be used in UIs etc."
                    description: "Account access schema validation"
                    validationSchema: "<Schema>"
                    properties:
                      abc: "<ABC>"
                      def: "<DEF>"
              xmlType:
                summary: XML type with validationSchema
                value:
                  - type: "xml"
                    name: "account_schema"
                    displayName: "To be used in UIs etc."
                    description: "Account access schema validation"
                    validationSchema: "<Schema>"
                    version: "1.0"
                    properties:
                      abc: "<ABC>"
                      def: "<DEF>"
              multipleElements:
                summary: Create multiple elements with different types
                value:
                  - type: "basic"
