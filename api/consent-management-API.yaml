      description: Represents a specific authorization action taken on a consent by a user.
      properties:
        id:
          description: Auth Id
          type: string
          example: "auth_id"
        userId:
          description: The unique ID of the user who performed this authorization.
          type: string
          example: "admin@carbon.super"
        type:
          description: The type of authorization (e.g., 'authorisation', 're-authorisation').
          type: string
          example: "authorisation"
        status:
          description: The current status of this specific authorization (e.g., 'created', 'approved', 'rejected').
          type: string
          example: "created"
        updatedTime:
          type: integer
          format: int32
        resources:
          description: Flexible resources field containing authorization-specific data as JSON.
          oneOf:
            - type: string
            - type: object
            - type: array
              items: {}
          example:
            accountIds: ["123456", "789012"]
    ValidateRequest:
      type: object
      description: Request payload for validating a consent for a specific action.
      required:
        - consentId
        - resourceParams
      properties:
        consentId:
          description: The unique identifier of the consent to validate.
          type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
        userId:
          description: The unique identifier of the user performing the action (optional).
          type: string
          example: "user123"
        clientId:
          description: The client ID of the application making the request (optional).
          type: string
          example: "banking-app-001"
        headers:
          description: Optional headers from the actual API request being validated.
          type: object
          additionalProperties:
            type: string
        payload:
          description: Optional payload from the actual API request being validated.
          type: object
        electedResource:
          description: The resource the user is trying to access (optional).
          type: string
        resourceParams:
          description: Parameters describing the specific action being validated.
          type: object
          required:
            - resource
            - httpMethod
          properties:
            resource:
              description: The API resource path being accessed.
              type: string
              example: "/aisp/accounts/{AccountId}?queryParam=queryParamValue"
            httpMethod:
              description: The HTTP method of the request.
              type: string
              example: "GET"
            context:
              description: Additional context about the request.
              type: string
              example: "/open-banking/v3.1/aisp"
    ValidateResponse:
      type: object
      description: Response payload from consent validation.
      properties:
        isValid:
          description: Whether the consent is valid for the requested action.
          type: boolean
          example: true
        modifiedPayload:
          description: Optional modified payload if the consent requires transformation of the request.
          type: object
          nullable: true
        errorCode:
          description: HTTP status code if validation failed (e.g., 401, 404, 500).
          type: integer
          example: 401
        errorMessage:
          description: Error type/code if validation failed (e.g., "invalid_consent_status", "consent_expired", "consent_not_found").
          type: string
          example: "consent_expired"
        errorDescription:
          description: Human-readable detailed error description if validation failed.
          type: string
          example: "Consent has expired. Status updated to: EXPIRED"
        consentInformation:
          description: |
            Complete consent information (excludes modifiedResponse field).

            **Includes enriched consent element details:**
            - Each consent element includes type, description, and attributes from the purpose definition
            - This allows clients to understand what each purpose means without additional API calls

            Always present in the response, regardless of validation result.
          allOf:
            - $ref: "#/components/schemas/ValidateConsentAPIResponse"
    ValidateConsentAPIResponse:
      type: object
      description: Consent information in validate response (same as ConsentAPIResponse but excludes modifiedResponse field)
      properties:
        id:
          type: string
          description: Unique identifier for the consent (UUID format)
          example: "123e4567-e89b-12d3-a456-426614174000"
        type:
          type: string
          description: The consent type (e.g., accounts, payments, etc.)
          example: "accounts"
        clientId:
          type: string
          description: Client ID of the application that created the consent
          example: "client-app-123"
        status:
          type: string
          description: Current status of the consent (CREATED, ACTIVE, EXPIRED, REVOKED, REJECTED, etc.)
          example: "ACTIVE"
        createdTime:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the consent was created
          example: 1699564800
        updatedTime:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the consent was last updated
          example: 1699651200
        validityTime:
          type: integer
          format: int64
          nullable: true
          description: Unix timestamp (seconds) until which the consent is valid. If expired, status will be EXPIRED. Omitted from response when null.
          example: 1707340800
        recurringIndicator:
          type: boolean
          nullable: true
          description: Indicates if the consent can be used repeatedly. Omitted from response when null.
          example: true
        frequency:
          type: integer
          nullable: true
          description: Number of times the consent can be used (if recurringIndicator is true). Omitted from response when null.
          example: 10
        dataAccessValidityDuration:
          type: integer
          format: int64
          nullable: true
          description: Duration in seconds for which data access is valid after each authorization. Omitted from response when null.
          example: 86400
        purposes:
          type: array
          description: |
            List of purposes containing consent elements with their approval state, mandatory flag, and **enriched details from element definitions**.
            Each purpose contains:
            - name: Name of the purpose
            - elements: Array of elements in this purpose

            Each element includes:
            - name: Element identifier
            - value: User-provided value for this element (if any)
            - isUserApproved: Whether the user has approved this element (boolean, default false)
            - isMandatory: Whether this element is mandatory (boolean, default true)
            - type: Element type from definition (string, json-schema, or attribute)
            - description: Element description from definition
            - properties: Element properties from definition (e.g., validationSchema, resourcePath, jsonPath)
          items:
            type: object
            properties:
              name:
                type: string
                description: Name of the purpose
                example: "marketing_communication_preferences"
              elements:
                type: array
                description: List of consent elements in this purpose with enriched details
                items:
                  allOf:
                    - $ref: "#/components/schemas/ConsentElementApprovalItem"
                    - type: object
                      properties:
                        type:
                          type: string
                          enum: [basic, json, xml]
                          description: Element type from the consent element definition
                          example: "basic"
                        description:
                          type: string
                          description: Element description from the consent element definition
                          example: "Allows access to the user's first name"
                        properties:
                          type: object
                          additionalProperties:
                            type: string
                          description: Element properties from the consent element definition
                          example:
                            jsonPath: "$.personal.firstName"
                            resourcePath: "/user/{nic}"
        attributes:
          type: object
          additionalProperties:
            type: string
          description: Custom key-value attributes associated with the consent
          example:
            channel: "mobile"
            region: "US"
        authorizations:
          type: array
          description: List of authorizations associated with this consent
          items:
            type: object
            properties:
              id:
                type: string
                example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              userId:
                type: string
                nullable: true
                description: User identifier. Omitted from response when null.
                example: "user-456"
              type:
                type: string
                example: "authorization"
              status:
                type: string
                example: "APPROVED"
              resources:
                type: object
                description: Authorization resources (always present, empty object if not set)
                example:
                  accountIds: ["123456", "789012"]
              updatedTime:
                type: integer
                format: int64
                example: 1699651200
      required:
        - id
        - type
        - clientId
        - status
        - createdTime
        - updatedTime
        - purposeGroups
    ConsentIdsResponse:
      type: object
      description: Response payload containing consent IDs matching the attribute search criteria.
      properties:
        consentIds:
          description: Array of consent IDs that match the search criteria, sorted alphabetically.
          type: array
          items:
            type: string
          example: ["123e4567-e89b-12d3-a456-426614174001", "123e4567-e89b-12d3-a456-426614174002", "123e4567-e89b-12d3-a456-426614174003"]
        count:
          description: The number of consent IDs returned.
          type: integer
          example: 3
    ConsentAttributeSearchResponse:
      $ref: "#/components/schemas/ConsentIdsResponse"
    ConsentPurposeCreateRequest:
      type: object
      required:
        - name
        - type
        - properties
      description: |
        Request object for creating a consent element. All fields marked as required must be provided.

        **Type Handler Architecture:**
        Each element type has specific requirements:
        - **basic**: Requires `resourcePath` and `jsonPath` in properties
        - **json**: Requires `validationSchema` field and can have arbitrary properties
        - **xml**: Requires `validationSchema` field and can have arbitrary properties

        **Batch Creation:**
        When creating multiple purposes in a batch:
        - Each purpose name must be unique within the batch
        - Each purpose name must not already exist in the organization
        - If any validation fails, the entire batch is rolled back (atomic operation)
      properties:
        name:
          type: string
          maxLength: 255
          description: |
            The name/identifier of the consent element. Must be unique within the organization.
            Database constraint: UNIQUE KEY unique_name_per_org (NAME, ORG_ID)
            Batch constraint: Must be unique within the batch request
          example: "license_read"
        description:
          type: string
          maxLength: 1024
          description: Optional description providing additional context about the purpose
          example: "Allows accessing license API"
        displayName:
          type: string
          description: Display name for the element, to be used in UIs etc.
          example: "First Name"
        version:
          type: string
          description: Version of the consent element
          example: "1.0"
        type:
          type: string
          enum:
            - basic
            - json
            - xml
          description: |
            The type of the element determines requirements:
            - 'basic': Requires `resourcePath` and `jsonPath` in properties
            - 'json': Requires `validationSchema` field
            - 'xml': Requires `validationSchema` field
          example: "basic"
        validationSchema:
          type: string
          description: |
            Validation schema (required for json and xml types)
          example: "<Schema>"
        properties:
          type: object
          additionalProperties:
            type: string
          description: |
            Key-value map of properties. Required properties depend on the type:
            - **basic**: Must have `resourcePath` and `jsonPath`
            - **json**: Can have arbitrary key-value pairs
            - **xml**: Can have arbitrary key-value pairs
          example:
            resourcePath: "/Patient/{firstName}"
            jsonPath: "$.patient.firstName"
    ConsentPurposeUpdateRequest:
      type: object
      required:
        - name
        - type
        - properties
      properties:
        name:
          type: string
          maxLength: 255
          description: Name for the consent element (required, must be unique within organization)
          example: "license_read_v2"
        description:
          type: string
          maxLength: 1024
          description: Description for the consent element (optional)
          example: "Updated description for API access"
        displayName:
          type: string
          description: Display name for the element
          example: "Updated Display Name"
        version:
          type: string
          description: Version of the consent element
          example: "1.1"
        type:
          type: string
          enum:
            - basic
            - json
            - xml
          description: |
            Type of the consent element (required). Determines requirements:
            - 'basic': Requires `resourcePath` and `jsonPath` in properties
            - 'json': Requires `validationSchema` field
            - 'xml': Requires `validationSchema` field
          example: "basic"
        validationSchema:
          type: string
          description: Validation schema (required for json and xml types)
          example: "<Schema>"
        properties:
          type: object
          additionalProperties:
            type: string
          description: |
            Key-value map of properties (required). Required properties depend on type:
            - **basic**: Must have `resourcePath` and `jsonPath`
            - **json**: Can have arbitrary key-value pairs
            - **xml**: Can have arbitrary key-value pairs
          example:
            resourcePath: "/Patient/{firstName}"
            jsonPath: "$.patient.firstName"
      description: All fields except description are required - partial updates are not supported
    ConsentPurposeResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the consent element (UUID with  prefix)
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        name:
          type: string
          description: The name/identifier of the consent element
          example: "license_read"
        description:
          type: string
          description: Description of the consent element (optional)
          example: "Allows accessing API"
        displayName:
          type: string
          description: Display name for the element
          example: "First Name"
        version:
          type: string
          description: Version of the consent element
          example: "1.0"
        type:
          type: string
          enum:
            - basic
            - json
            - xml
          description: |
            The type of the element. Determines requirements:
            - 'basic': Requires `resourcePath` and `jsonPath` in properties
            - 'json': Requires `validationSchema` field
            - 'xml': Requires `validationSchema` field
          example: "basic"
        validationSchema:
          type: string
          description: Validation schema (present for json and xml types)
          example: "<Schema>"
        properties:
          type: object
          additionalProperties:
            type: string
          description: |
            Key-value map of properties (optional). Content depends on the element type:
            - **basic**: Must have `resourcePath` and `jsonPath`
            - **json**: Can have arbitrary key-value pairs
            - **xml**: Can have arbitrary key-value pairs
          example:
            resourcePath: "/Patient/{firstName}"
            jsonPath: "$.patient.firstName"
      required:
        - id
        - name
        - type
    ConsentPurposeListResponse:
      type: object
      description: The response from a successful consent element list/search query.
      properties:
        data:
          type: array
          description: Array of consent elements matching the search criteria
          items:
            $ref: "#/components/schemas/ConsentPurposeResponse"
        metadata:
          $ref: "#/components/schemas/ConsentSearchMetadata"
      required:
        - data
        - metadata
    PurposeGroupCreateRequest:
      type: object
      required:
        - name
        - purposes
      description: |
        Request object for creating a consent element.

        **Purpose Validation:**
        All purpose names in the `purposes` array must reference existing consent elements
        in the organization. The API will validate each purpose name and fail the request
        if any purpose doesn't exist.

        **Uniqueness:**
        Group names must be unique within the organization.
      properties:
        name:
          type: string
          maxLength: 255
          description: |
            The name/identifier of the purpose. Must be unique within the organization.
            Use descriptive names that indicate the logical grouping (e.g., "marketing_preferences",
            "account_access_permissions").
          example: "marketing_communication_preferences"
        displayName:
          type: string
          description: Display name for the purpose. To be used in UIs etc.
          example: "Marketing Communication Preferences"
        description:
          type: string
          maxLength: 1024
          description: Optional description providing additional context about the purpose
          example: "User preferences related to marketing communications"
        version:
          type: string
          description: Version of the purpose (optional in request)
          example: "1"
        purposes:
          type: array
          minItems: 1
          description: |
            Array of purpose references with mandatory flags. Each purpose must already exist
            in the organization's consent elements. At least one purpose is required.
          items:
            $ref: "#/components/schemas/PurposeGroupPurposeItem"
          example:
            - purposeName: "user_email"
              version: "1"
              isMandatory: true
            - purposeName: "user_phone"
              version: "1"
              isMandatory: false
    PurposeGroupUpdateRequest:
      type: object
      required:
        - name
        - purposes
      description: |
        Request object for updating a consent element. This is a full replacement
        operation - all required fields must be provided.

        **Important:** The purposes array replaces the existing purposes completely.
        Any purposes not included in the update will be removed from the group.
      properties:
        name:
          type: string
          maxLength: 255
          description: |
            The name/identifier of the purpose (can be changed or kept the same).
            Must remain unique within the organization.
          example: "marketing_communication_preferences"
        displayName:
          type: string
          description: Display name for the purpose. To be used in UIs etc.
          example: "Marketing Communication Preferences"
        description:
          type: string
          maxLength: 1024
          description: Optional description for the purpose
          example: "Updated preferences for all marketing communications"
        version:
          type: string
          description: Version of the purpose (optional in request)
          example: "1"
        purposes:
          type: array
          minItems: 1
          description: |
            Complete array of purpose references with mandatory flags. This replaces
            all existing purposes in the group. At least one purpose is required.
          items:
            $ref: "#/components/schemas/PurposeGroupPurposeItem"
          example:
            - purposeName: "user_email"
              version: "1"
              isMandatory: true
            - purposeName: "user_phone"
              version: "1"
              isMandatory: true
            - purposeName: "user_sms"
              version: "1"
              isMandatory: false
    PurposeGroupPurposeItem:
      type: object
      required:
        - purposeName
        - isMandatory
      description: |
        Represents a single purpose within a purpose, including whether it is
        mandatory for the consent to be valid.

        **Purpose Name Validation:**
        The `purposeName` must reference an existing consent element in the organization.
        If the purpose doesn't exist, the API will return a 400 Bad Request error.
      properties:
        purposeName:
          type: string
          description: |
            The name of an existing consent element to include in this group.
            Must match the name of a purpose that has been previously created in the organization.
          example: "user_email"
        version:
          type: string
          description: Version of the element to reference
          example: "1"
        isMandatory:
          type: boolean
          description: |
            Indicates whether this purpose must be approved for consents using this group.

            - `true`: This purpose is required - user must approve it
            - `false`: This purpose is optional - user can choose to approve or decline

            This flag allows fine-grained control over which purposes are essential vs.
            optional within the logical grouping.
          example: true
    PurposeGroupResponse:
      type: object
      required:
        - id
        - name
        - purposes
        - createdTime
        - updatedTime
      description: Response object containing complete purpose information
      properties:
        id:
          type: string
          description: Unique identifier for the purpose (UUID with GROUP- prefix)
          example: "GROUP-a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        name:
          type: string
          description: The name/identifier of the purpose
          example: "marketing_communication_preferences"
        displayName:
          type: string
          description: Display name for the purpose. To be used in UIs etc.
          example: "Marketing Communication Preferences"
        description:
          type: string
          description: Description of the purpose (optional)
          example: "User preferences related to marketing communications"
        version:
          type: string
          description: Version of the purpose (always present in response)
          example: "1.0"
        clientId:
          type: string
          description: The client ID of the Third-Party Provider (TPP) that created this purpose
          example: "TPP-CLIENT-001"
        purposes:
          type: array
          description: Array of purposes included in this group with their mandatory flags
          items:
            $ref: "#/components/schemas/PurposeGroupPurposeItem"
          example:
            - purposeName: "user_email"
              version: "1.0"
              isMandatory: true
            - purposeName: "user_phone"
              version: "1.0"
              isMandatory: false
            - purposeName: "user_address"
              version: "1.0"
              isMandatory: false
        createdTime:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the purpose was created
          example: 1704153600
        updatedTime:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the purpose was last updated
          example: 1704153600
    PurposeGroupListResponse:
      type: object
      required:
        - data
        - metadata
      description: Response object for purpose list/search operations
      properties:
        data:
          type: array
          description: Array of purposes matching the search criteria
          items:
            $ref: "#/components/schemas/PurposeGroupResponse"
        metadata:
          $ref: "#/components/schemas/ConsentSearchMetadata"
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Basic Authentication using username and password.
