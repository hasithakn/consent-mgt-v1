    put:
      summary: Update a specific version of a consent purpose
      description: |
        Updates an existing version of a consent purpose. This is a full replacement operation -
        all fields must be provided in the request.

        **Update Restrictions:**
        - Updates are only allowed if the purpose version is not currently bound to any active consents.
        - If the purpose version is referenced in any consent, the update will be rejected.

        **Element Name Validation:**
        All element names referenced in the updated `elements` array must already exist
        in the organization's consent elements.

        **Validation Rules:**
        - All fields from create request are required (full replacement)
        - Purpose name must match the path parameter
        - All element names must reference existing consent elements
        - At least one element must be provided
        - Duplicate element names within the purpose are not allowed

        **Note:** This operation replaces the entire elements list - any elements not
        included in the update will be removed from the purpose.
      operationId: updatePurposeVersion
      tags:
        - Consent Purpose
      parameters:
        - in: header
          name: org-id
          required: true
          description: The unique identifier for the organization
          schema:
            type: string
            example: "ORG-001"
        - in: header
          name: TPP-client-id
          required: true
          description: The client ID of the Third-Party Provider (TPP) application making the request
          schema:
            type: string
            example: "TPP-CLIENT-001"
        - name: purposeName
          in: path
          required: true
          description: The name of the consent purpose
          schema:
            type: string
            example: "marketing_communication_preferences_purpose"
        - name: version
          in: path
          required: true
          description: The version number to update
          schema:
            type: string
            example: "1.0"
