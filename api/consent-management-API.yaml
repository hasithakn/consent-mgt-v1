    delete:
      summary: Delete a specific version of a consent purpose
      description: |
        Deletes a specific version of a consent purpose.

        **Delete Restrictions:**
        - Deletion is only allowed if the purpose version is not currently bound to any active consents.
        - If the purpose version is referenced in any consent, the deletion will be rejected.
        - Cannot delete the only remaining version of a purpose (use purpose deletion instead)

        **Cascade Behavior:**
        Deleting a purpose version only removes that specific version. It does NOT delete
        the individual consent elements that were part of the purpose - those remain available
        for use in other purposes or directly in consents.
      operationId: deletePurposeVersion
      tags:
        - Consent Purpose
      parameters:
        - in: header
          name: org-id
          required: true
          description: The unique identifier for the organization
          schema:
            type: string
            example: "ORG-001"
        - name: purposeName
          in: path
          required: true
          description: The name of the consent purpose
          schema:
            type: string
            example: "marketing_communication_preferences_purpose"
        - name: version
          in: path
          required: true
          description: The version number to delete
          schema:
            type: string
            example: "2.0"
      responses:
        "204":
          description: Successfully deleted purpose version
        "400":
          description: Bad Request - Version is in use or cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentErrorCommon"
              examples:
                versionInUse:
                  summary: Version is referenced by active consents
                  value:
                    code: "BAD_REQUEST"
                    message: "Version in use"
                    description: "Cannot delete version that is referenced by active consents"
                    traceId: "20260107T123456Z-abc123"
                lastVersion:
                  summary: Cannot delete the only version
                  value:
                    code: "BAD_REQUEST"
                    message: "Cannot delete last version"
                    description: "Cannot delete the only remaining version of a purpose"
                    traceId: "20260107T123456Z-abc123"
        "404":
          description: Purpose or version not found
          content:
